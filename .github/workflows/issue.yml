name: Issue-triggered RCE

on:
  issues:
    types: [opened]

jobs:
  rce:
    runs-on: ubuntu-latest

    steps:
      - name: Extract command from issue title
        id: branches
        run: |
          echo "branch-name=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT

      - name: Execute attacker-controlled command
        env:
          BRANCH: ${{ steps.branches.outputs.branch-name }}
        run: |
          $BRANCH

      - name: Confirm RCE
        run: |
          test -f /tmp/OWNED_BY_ISSUE && echo "RCE CONFIRMED"
